<div id="view-lightsout" class="puzzle-view">
  <button class="puzzle-btn puzzle-back" data-cerrar-puzzle><i class="fa-solid fa-arrow-left"></i> Volver</button>
  <h3 class="puzzle-title">Lights Out</h3>
  <div class="rob-description">
    Toca una luz para cambiarla, junto con sus vecinas de arriba, abajo, izquierda y derecha.<br><br>
    Apaga todas las luces para resolverlo.
  </div>
  <table id="lightsBoard" class="puzzle-table"></table>
  <div class="puzzle-actions">
    <button class="puzzle-btn" id="lightsNew"><i class="fa-solid fa-shuffle"></i> Nuevo</button>
    <button class="puzzle-btn" id="lightsReset"><i class="fa-solid fa-rotate-left"></i> Reiniciar</button>
  </div>
  <div class="puzzle-message" id="lightsMessage"></div>
</div>
