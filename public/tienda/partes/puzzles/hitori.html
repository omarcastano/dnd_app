<div id="view-hitori" class="puzzle-view">
  <button class="puzzle-btn puzzle-back" data-cerrar-puzzle><i class="fa-solid fa-arrow-left"></i> Volver</button>
  <h3 class="puzzle-title">Hitori</h3>
  <div class="rob-description">
    Sombrea algunas celdas para cumplir estas reglas:<br><br>
    • No puede haber dos celdas sombreadas juntas, ni arriba, abajo, a la izquierda o a la derecha.<br>
    • En cada fila y en cada columna, los numeros sin sombrear no pueden repetirse.<br>
    • Las celdas sin sombrear deben quedar conectadas entre si.
  </div>
  <table id="hitoriBoard" class="puzzle-table"></table>
  <div class="puzzle-actions">
    <button class="puzzle-btn" id="hitoriCheck"><i class="fa-solid fa-circle-check"></i> Comprobar</button>
    <button class="puzzle-btn" id="hitoriReset"><i class="fa-solid fa-rotate-left"></i> Reiniciar</button>
  </div>
  <div class="puzzle-message" id="hitoriMessage"></div>
</div>
