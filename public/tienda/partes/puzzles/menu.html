<div id="puzzle-menu" class="puzzle-menu">
  <p class="puzzle-intro">Derrotaste a una bestia. Abre la caja para saber que puzzle te toca.</p>
  <div class="puzzle-row">
    <div class="loot-box-wrap">
      <button class="loot-box" id="puzzleBox" title="Abrir caja"><i class="fa-solid fa-dice-d20"></i></button>
      <div class="loot-result" id="puzzleResult"></div>
    </div>
    <div class="puzzle-code">
      <label class="puzzle-code-label" for="puzzleCodeInput">Tengo un codigo</label>
      <input id="puzzleCodeInput" class="puzzle-code-input" type="text" inputmode="numeric" maxlength="4" placeholder="0000">
      <button class="puzzle-btn" id="puzzleCodeBtn"><i class="fa-solid fa-key"></i> Abrir</button>
      <div class="puzzle-message" id="puzzleCodeMessage"></div>
    </div>
  </div>
</div>
