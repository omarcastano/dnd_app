<div id="view-cipher" class="puzzle-view">
  <button class="puzzle-btn puzzle-back" data-cerrar-puzzle><i class="fa-solid fa-arrow-left"></i> Volver</button>
  <h3 class="puzzle-title">Cifrado</h3>
  <div class="puzzle-nivel">Dificultad muy alta · 3 rondas: César, sustitución y Vigenère</div>
  <div class="puzzle-descripcion">
    Descifra tres mensajes secretos, cada vez con un cifrado más complicado. Supera una ronda para pasar a la siguiente.
  </div>
  <div id="cipherRonda" class="cipher-rondas"></div>
  <div id="cipherContainer"></div>
  <div class="puzzle-actions">
    <button class="puzzle-btn" id="cipherCheck"><i class="fa-solid fa-circle-check"></i> Comprobar</button>
    <button class="puzzle-btn" id="cipherPista"><i class="fa-solid fa-lightbulb"></i> Pista</button>
    <button class="puzzle-btn" id="cipherSiguiente" style="display:none"><i class="fa-solid fa-forward"></i> Siguiente ronda</button>
    <button class="puzzle-btn" id="cipherReset"><i class="fa-solid fa-rotate-left"></i> Empezar de nuevo</button>
  </div>
  <div class="puzzle-message" id="cipherMessage"></div>
</div>
